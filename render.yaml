services:
  - type: web
    name: basetokenscout
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BASE_RPC_URL
        sync: false
      - key: BASESCAN_API_KEY
        sync: false
      - key: AGENT_ENDPOINT
        sync: false
      - key: AGENT_ID
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.10.0"
    healthCheckPath: /health
    autoDeploy: true
