services:
  - type: web
    name: risetokenscout
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: RISE_RPC_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false
